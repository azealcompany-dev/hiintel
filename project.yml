name: HiringIntel
options:
  bundleIdPrefix: com.azealcompany
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: B8VKLXY4L2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  HiringIntel:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HiringIntel
        excludes:
          - "**/*.entitlements"
      - path: Shared
      - path: feed.json
        buildPhase: resources
        optional: true
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azealcompany.hiringintel
        PRODUCT_NAME: HiringIntel
        PRODUCT_MODULE_NAME: HiringIntel
        INFOPLIST_KEY_CFBundleDisplayName: HiIntel
        INFOPLIST_KEY_CFBundleName: HiIntel
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: HiringIntel/HiringIntel.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HiringIntel/HiringIntelMac.entitlements
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        COMBINE_HIDPI_IMAGES[sdk=macosx*]: YES
        REGISTER_APP_GROUPS: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HiringIntel/HiringIntel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.azealcompany.hiringintel
    info:
      path: HiringIntel/Info.plist
      properties:
        CFBundleDisplayName: HiIntel
        CFBundleURLTypes:
          - CFBundleURLName: com.azealcompany.hiringintel
            CFBundleURLSchemes:
              - hiringintel
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
    dependencies:
      - target: HiringIntelWidget
    scheme:
      gatherCoverageData: false
  HiringIntelWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HiringIntelWidget
        excludes:
          - "**/*.entitlements"
          - Info.plist
      - path: Shared
      - path: feed.json
        buildPhase: resources
        optional: true
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azealcompany.hiringintel.widget
        PRODUCT_NAME: HiringIntelWidget
        PRODUCT_MODULE_NAME: HiringIntelWidget
        INFOPLIST_FILE: HiringIntelWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HiIntel
        CODE_SIGN_ENTITLEMENTS: HiringIntelWidget/HiringIntelWidget.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HiringIntelWidget/HiringIntelWidgetMac.entitlements
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        REGISTER_APP_GROUPS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: HiringIntelWidget/HiringIntelWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.azealcompany.hiringintel
    info:
      path: HiringIntelWidget/Info.plist
      properties:
        CFBundleDisplayName: HiIntel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  HiringIntel:
    build:
      targets:
        HiringIntel: all
        HiringIntelWidget: [build]
    run:
      config: Debug
      askForAppToLaunch: true
    profile:
      config: Release
    archive:
      config: Release
