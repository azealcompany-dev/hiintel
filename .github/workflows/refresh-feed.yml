name: Refresh SDR BDR AE feed

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HIINTEL_FEED_TOKEN: ${{ secrets.HIINTEL_FEED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull company boards
        run: python3 scripts/build_feed.py --out feed.json
      - name: Commit feed if changed
        run: |
          git config user.name "hiintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Refresh SDR, BDR, and AE openings from company boards."
          git push
      - name: Publish to public hiintel-feed
        if: ${{ env.HIINTEL_FEED_TOKEN != '' }}
        run: |
          tmp="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${HIINTEL_FEED_TOKEN}@github.com/azealcompany-dev/hiintel-feed.git" "$tmp"
          cp feed.json "$tmp/feed.json"
          cd "$tmp"
          git config user.name "hiintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "Public feed already current"
            exit 0
          fi
          git commit -m "Refresh SDR, BDR, and AE openings from company boards."
          git push
