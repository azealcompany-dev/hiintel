name: Refresh feed

on:
  schedule:
    - cron: "0 12,16,21 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull company boards
        run: python3 scripts/build_feed.py --out feed.json
      - name: Commit feed if changed
        run: |
          git config user.name "hiintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Refresh SDR, BDR, and AE openings from company boards."
          git push
